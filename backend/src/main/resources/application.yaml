spring:
    application:
        name: devhub
    mongodb:
        uri: ${MONGO_URI}

server:
    port: ${PORT:8080}

management:
    endpoints:
        web:
            exposure:
                include: health
            # ADD THIS CORS CONFIGURATION BLOCK
            cors:
                allowed-origins: ${ALLOWED_ORIGIN:http://localhost:5173}
                allowed-methods: GET

app:
    cors:
        allowed-origin: ${ALLOWED_ORIGIN:http://localhost:5173}
    admin-key: ${ADMIN_KEY:}
